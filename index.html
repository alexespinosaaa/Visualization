<!-- index.html (Option A: calendar + timeseries full row + violin full row + scatter + pcp) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital Risk Explorer</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #f6f7f9;
      --card: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 8px 22px rgba(17,24,39,0.06);
      --accent: #0984e3;
      --danger: #d63031;
      --radius: 14px;
      --gap: 12px;
      --pad: 12px;
    }

    *{ box-sizing: border-box; }

    body{
      font-family: "Inter", sans-serif;
      background: var(--bg);
      margin: 0;
      color: var(--ink);
    }

    .dashboard{
      max-width: 1440px;
      margin: 0 auto;
      padding: 12px 16px 22px 16px;
    }

    header{
      position: sticky;
      top: 0;
      z-index: 2000;
      background: rgba(246,247,249,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(229,231,235,0.85);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 10px 2px;
      margin-bottom: 12px;
    }

    .header-left{
      display:flex;
      flex-direction:column;
      gap: 2px;
      min-width: 260px;
    }

    h1{
      font-size: 20px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .subtitle{
      font-size: 12px;
      color: var(--muted);
      line-height: 1.2rem;
    }

    .header-right{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap: 10px;
      flex: 1;
    }

    .btn-reset{
      border: 1px solid rgba(214,48,49,0.35);
      background: rgba(214,48,49,0.08);
      color: var(--danger);
      padding: 8px 12px;
      border-radius: 10px;
      cursor:pointer;
      font-weight: 800;
      font-size: 12px;
      white-space: nowrap;
      transition: 0.15s ease;
    }

    .btn-reset:hover{
      background: rgba(214,48,49,0.12);
      transform: translateY(-1px);
    }

    /* ---------------------------
       GRID (UPDATED)
       - Calendar full width
       - Timeseries full width (own row)
       - Violin full width (own row)
       - Scatter full width
       - PCP full width
       --------------------------- */
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "calendar calendar"
        "timeseries timeseries"
        "events events"
        "scatterplot scatterplot"
        "pcp pcp";
      gap: var(--gap);
      align-items: start;
    }

    /* IMPORTANT: keep these IDs exactly — main.js depends on them */
    #view-calendar{ grid-area: calendar; }
    #view-timeseries{ grid-area: timeseries; }
    #view-events{ grid-area: events; }
    #view-scatterplot{ grid-area: scatterplot; }
    #view-pcp{ grid-area: pcp; }

    /* ---------------------------
       PANELS
       --------------------------- */
    .panel{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: var(--pad);
      position: relative;
      overflow: hidden;

      /* crucial: panels are flex columns so views can fill height */
      display: flex;
      flex-direction: column;
    }

    /* Calendar header + metric buttons remain in HTML (heatmap unchanged) */
    .panel-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap: 10px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(229,231,235,0.9);
      flex: 0 0 auto;
    }

    .panel-header-left{
      display:flex;
      flex-direction:column;
      gap: 3px;
      min-width: 220px;
    }

    .panel-title{
      font-weight: 900;
      font-size: 13px;
      letter-spacing: -0.01em;
      margin: 0;
      line-height: 1.15;
    }

    .panel-subtitle{
      font-size: 12px;
      color: var(--muted);
      line-height: 1.05rem;
    }

    .btn-group{
      display:flex;
      gap: 6px;
      background: #f2f3f5;
      border: 1px solid var(--border);
      padding: 3px;
      border-radius: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn{
      border: none;
      background: transparent;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 900;
      font-size: 12px;
      color: var(--muted);
      transition: all 0.15s ease;
    }

    .btn:hover{ background:#e9ecef; color: var(--ink); }
    .btn.active{
      background:#fff;
      color: var(--ink);
      box-shadow: 0 2px 6px rgba(17,24,39,0.08);
      border: 1px solid rgba(17,24,39,0.08);
    }

    /* Calendar summary row (kept) */
    .summary-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(229,231,235,0.95);
      flex: 0 0 auto;
    }
    .summary-left{
      font-size: 12px;
      color: var(--muted);
      display:flex;
      align-items:center;
      flex-wrap: wrap;
      gap: 8px;
      line-height: 1.15rem;
    }

    /* Systematic sizing: panels get height, view svgs will fill */
    #view-calendar{ min-height: 280px; }
    #view-timeseries{ min-height: 620px; }
    #view-events{ min-height: 520px; }
    #view-scatterplot{ min-height: 560px; }
    #view-pcp{ min-height: 560px; }

    /* Tooltip (global) */
    .chart-tooltip{
      position: absolute;
      background: rgba(255,255,255,0.97);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(229,231,235,0.95);
      box-shadow: 0 8px 22px rgba(17,24,39,0.14);
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      z-index: 5000;
    }

    @media (max-width: 1050px){
      header{
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .header-right{
        justify-content: space-between;
      }
      .grid{
        grid-template-columns: 1fr;
        grid-template-areas:
          "calendar"
          "timeseries"
          "events"
          "scatterplot"
          "pcp";
      }
      #view-calendar{ min-height: 260px; }
      #view-timeseries{ min-height: 440px; }
      #view-events{ min-height: 500px; }
    }
  </style>
</head>

<body>
  <div class="dashboard">

    <!-- STICKY HEADER -->
    <header>
      <div class="header-left">
        <h1>Hospital Risk Explorer</h1>
        <div class="subtitle">Capacity, wellbeing &amp; event impact — interactive operations dashboard</div>
      </div>

      <div class="header-right">
        <button class="btn-reset" onclick="window.resetState()">Reset All</button>
      </div>
    </header>

    <!-- GRID -->
    <div class="grid">

      <!-- TASK 1: CALENDAR (kept “as-is”) -->
      <div class="panel" id="view-calendar">
        <div class="panel-header">
          <div class="panel-header-left">
            <div class="panel-title">1. Annual Risk Overview</div>
            <div class="panel-subtitle">Central context: click week to drive all views</div>
          </div>
          <div class="btn-group" id="metric-controls">
            <button class="btn active" onclick="setMetric('refusals')">Refusals</button>
            <button class="btn" onclick="setMetric('morale')">Morale</button>
            <button class="btn" onclick="setMetric('occupancy')">Occupancy</button>
            <button class="btn" onclick="setMetric('satisfaction')">Satisfaction</button>
          </div>
        </div>

        <!-- SVG injected by view-calendar.js -->
        <div class="summary-row" id="selection-summary" aria-hidden="true">
          <div class="summary-left" id="summary-left"></div>
        </div>
      </div>

      <!-- TASK 1: TIMESERIES (now empty shell; view renders its own header/controls like PCP/Scatter) -->
      <div class="panel" id="view-timeseries"></div>

      <!-- TASK 2: EVENT IMPACT (now empty shell; view renders its own header/controls like PCP/Scatter) -->
      <div class="panel" id="view-events"></div>

      <!-- TASK 3: SCATTERPLOT -->
      <div class="panel" id="view-scatterplot"></div>

      <!-- TASK 5: PCP -->
      <div class="panel" id="view-pcp"></div>

    </div>
  </div>

  <div class="chart-tooltip"></div>

  <script type="module" src="./main.js"></script>

  <script>
    function setMetric(m) {
      document.querySelectorAll('#metric-controls .btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      window.dispatch({ type: "SET_METRIC", value: m });
    }
  </script>
</body>
</html>
